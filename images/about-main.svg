<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#8a6d3b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.25" r="0.65">
      <stop offset="0" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.55" r="0.9">
      <stop offset="0.55" stop-color="rgba(10,15,25,0)"/>
      <stop offset="1" stop-color="rgba(10,15,25,0.45)"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  
      <path d="M 832 1000 L 832 380 Q 832 140 1120 140 Q 1408 140 1408 380 L 1408 1000 Z"
            fill="rgba(255,255,255,0.10)"/>
      <path d="M 160 1000 L 160 550 Q 160 400 320 400 Q 480 400 480 550 L 480 1000 Z"
            fill="rgba(255,255,255,0.06)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#vig)"/>
  <rect x="120" y="760" width="64" height="4" fill="#d4a853"/>
  <text x="120" y="860" font-family="Georgia, serif" font-size="34" letter-spacing="10" fill="rgba(255,255,255,0.85)">SINCE 1994</text>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.5" fill="transparent"/>
</svg>
