<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3a30"/>
      <stop offset="1" stop-color="#6a8a70"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.25" r="0.65">
      <stop offset="0" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.55" r="0.9">
      <stop offset="0.55" stop-color="rgba(10,15,25,0)"/>
      <stop offset="1" stop-color="rgba(10,15,25,0.45)"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  
      <g transform="rotate(-18 800 500)" fill="rgba(255,255,255,0.07)">
        <rect x="160" y="200" width="96" height="1100" rx="40"/>
        <rect x="384" y="200" width="48" height="1100" rx="24"/>
        <rect x="992" y="200" width="144" height="1100" rx="48"/>
        <rect x="1280" y="200" width="64" height="1100" rx="26"/>
      </g>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#vig)"/>
  <rect x="120" y="760" width="64" height="4" fill="#d4a853"/>
  <text x="120" y="860" font-family="Georgia, serif" font-size="34" letter-spacing="10" fill="rgba(255,255,255,0.85)">PARENT</text>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.5" fill="transparent"/>
</svg>
